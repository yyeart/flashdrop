services:
  flashdrop-postgres:
    image: postgres:18.1-bookworm
    container_name: flashdrop-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Copy .env.example to .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Copy .env.example to .env}
      - POSTGRES_DB=${POSTGRES_DB:?Copy .env.example to .env}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: always

  flashdrop-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
    depends_on:
      flashdrop-postgres:
        condition: service_healthy

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: flashdrop-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:flashdrop-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  pg_data:
  